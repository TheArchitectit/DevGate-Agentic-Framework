name: CI — ctrl-alt-defeat

# DevGate CI for Godot 4 card game prototype (15 files, Sprint 5/6)
#   gdlint             — GDScript linter
#   gdparse            — GDScript syntax/parse check via Godot headless
#   guardrails         — DevGate pattern + semantic rule scan
#   completeness-check — Verify minimum content (cards, enemies, encounters)
#   progression-check  — Verify SceneManager and reward system exist

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gdlint:
    name: GDScript Lint (gdlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.* || pip install gdtoolkit

      - name: Run gdlint
        run: |
          find . -name "*.gd" -not -path "./.git/*" | xargs gdlint --disable line-length,max-returns || true

      - name: Run gdformat check
        run: |
          find . -name "*.gd" -not -path "./.git/*" | xargs gdformat --check || true

  gdparse:
    name: GDScript Parse Check (Godot headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4 stable
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3*
          mv Godot_v4.3* godot

      - name: Parse check all scripts
        run: |
          EXIT_CODE=0
          for f in $(find . -name "*.gd" -not -path "./.git/*"); do
            if ! ./godot --headless --check-only --script "$f" 2>&1 | grep -v "^Godot Engine"; then
              echo "PARSE ERROR: $f"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

  guardrails-scan:
    name: Guardrails Pattern + Semantic Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run pattern-rules scan
        run: |
          echo "Scanning against .guardrails/prevention-rules/pattern-rules.json"
          if [ -f .guardrails/prevention-rules/pattern-rules.json ]; then
            node -e "
              const fs = require('fs');
              const rules = JSON.parse(fs.readFileSync('.guardrails/prevention-rules/pattern-rules.json','utf8'));
              const { execSync } = require('child_process');
              let violations = 0;
              for (const rule of rules.rules) {
                if (!rule.enabled) continue;
                const files = execSync('find . -name \"*.gd\" -not -path \"./.git/*\"', {encoding:'utf8'}).trim().split('\n');
                for (const file of files) {
                  const content = fs.readFileSync(file, 'utf8');
                  if (new RegExp(rule.pattern).test(content)) {
                    const ctx = rule.forbidden_context ? new RegExp(rule.forbidden_context, 'i').test(content) : false;
                    if (!ctx) {
                      console.log('[' + rule.severity.toUpperCase() + '] ' + rule.rule_id + ': ' + file + ' — ' + rule.message);
                      violations++;
                    }
                  }
                }
              }
              console.log('\nTotal violations: ' + violations);
              if (violations > 0) process.exit(1);
            " || true
          fi

      - name: Run semantic-rules scan
        run: |
          echo "Scanning against .guardrails/prevention-rules/semantic-rules.json"
          echo "(AST-based scan requires DevGate semantic-scan.mjs — running pattern fallback)"

      - name: Check failure registry for active issues
        run: |
          echo "Active failures in registry:"
          if [ -f .guardrails/failure-registry.jsonl ]; then
            grep '"status":"active"' .guardrails/failure-registry.jsonl | while read -r line; do
              echo "  - $(echo "$line" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['failure_id']+': '+d['error_message'][:80])")"
            done
          fi

  completeness-check:
    name: Content Completeness Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count card definitions
        run: |
          CARD_COUNT=$(find . -name "*.tres" -path "*/cards/*" 2>/dev/null | wc -l)
          if [ "$CARD_COUNT" -eq 0 ]; then
            # Try counting in card database script
            CARD_COUNT=$(grep -c "CardDef\|card_def\|new_card\|\"name\"" --include="*card*database*" --include="*card*" -r . 2>/dev/null || echo "0")
          fi
          echo "Card definitions found: $CARD_COUNT"
          if [ "$CARD_COUNT" -lt 20 ]; then
            echo "WARNING: Fewer than 20 cards — insufficient for gameplay testing (Sprint 7 target: 20+)"
          fi

      - name: Count enemy types
        run: |
          ENEMY_COUNT=$(find . -name "*.tres" -path "*/enemies/*" 2>/dev/null | wc -l)
          if [ "$ENEMY_COUNT" -eq 0 ]; then
            ENEMY_COUNT=$(grep -c "enemy\|Enemy" --include="*enemy*" -r . 2>/dev/null || echo "1")
          fi
          echo "Enemy types found: $ENEMY_COUNT"
          if [ "$ENEMY_COUNT" -lt 5 ]; then
            echo "WARNING: Fewer than 5 enemy types — need variety for Sprint 7"
          fi

      - name: Count combat encounters
        run: |
          ENCOUNTER_COUNT=$(find . -name "*.tres" -path "*/encounters/*" -o -name "*.tres" -path "*/combat/*" 2>/dev/null | wc -l)
          echo "Combat encounters found: $ENCOUNTER_COUNT"
          if [ "$ENCOUNTER_COUNT" -lt 3 ]; then
            echo "WARNING: Fewer than 3 combat encounters — need encounter manager for Sprint 7"
          fi

  progression-check:
    name: Progression System Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for SceneManager autoload
        run: |
          if [ -f "project.godot" ]; then
            if grep -q "SceneManager\|scene_manager" project.godot; then
              echo "SceneManager autoload found."
            else
              echo "WARNING: No SceneManager autoload in project.godot — no progression tracking"
            fi
          fi

      - name: Check for reward system
        run: |
          if grep -r "reward\|loot\|xp\|experience" --include="*.gd" . 2>/dev/null; then
            echo "Reward system references found."
          else
            echo "WARNING: No reward system found — combat victories give no loot"
          fi

      - name: Check for save system
        run: |
          if grep -r "save\|persist\|ConfigFile\|FileAccess" --include="*.gd" . 2>/dev/null; then
            echo "Save system references found."
          else
            echo "WARNING: No save system found — progression will not persist"
          fi

  guardrails-summary:
    name: Guardrails Summary
    runs-on: ubuntu-latest
    needs: [gdlint, gdparse, guardrails-scan, completeness-check, progression-check]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## DevGate Guardrails Summary — ctrl-alt-defeat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| gdlint | ${{ needs.gdlint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gdparse | ${{ needs.gdparse.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| guardrails-scan | ${{ needs.guardrails-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| completeness-check | ${{ needs.completeness-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| progression-check | ${{ needs.progression-check.result }} |" >> $GITHUB_STEP_SUMMARY
