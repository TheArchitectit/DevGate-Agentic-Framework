name: CI — LobsterWars

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    name: Build + Test + Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test (vitest)
        run: npx vitest run --reporter=verbose

      - name: Guardrails scan — client-trusted values
        run: |
          echo "Scanning for client-trusted gameplay values..."
          grep -rnE 'input\.(damage|health|position|speed|velocity|score)\s*(\|\||\?\?)\s*\d' src/server/ && \
            { echo "FAIL: Server trusts client-sent gameplay values"; exit 1; } || \
            echo "PASS: No client-trusted gameplay values found"

      - name: Guardrails scan — CORS wildcard
        run: |
          echo "Scanning for CORS wildcard..."
          grep -rnE "origin\s*:\s*['\"]\*['\"]" src/server/ && \
            { echo "FAIL: CORS wildcard detected"; exit 1; } || \
            echo "PASS: No CORS wildcard found"

      - name: Guardrails scan — setTimeout in game logic
        run: |
          echo "Scanning for setTimeout in game logic..."
          grep -rnE 'setTimeout\s*\(' src/server/ src/shared/ | grep -v test | grep -v spec && \
            { echo "FAIL: setTimeout used in game logic — use fixed timestep loop"; exit 1; } || \
            echo "PASS: No setTimeout in game logic"

      - name: Guardrails scan — in-memory matchmaking
        run: |
          echo "Scanning for in-memory matchmaking state..."
          grep -rnE '(matchmaking|rooms|queue)\s*(:\s*=|\s*=\s*)\s*(\[\]|new Map|new Set|\{\})' src/server/ | grep -v redis | grep -v database && \
            { echo "FAIL: In-memory matchmaking state — use Redis or database"; exit 1; } || \
            echo "PASS: No unpersisted matchmaking state found"
