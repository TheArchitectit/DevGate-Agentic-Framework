name: CI — TowerDefense01

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    name: Build + Vet + Test + Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race -count=1

      - name: Guardrails scan — hardcoded frame time
        run: |
          echo "Scanning for hardcoded 1.0/60.0 frame time..."
          grep -rnE '1\.0\s*/\s*60\.0|1\.0\s*/\s*60[^.]' --include="*.go" src/ | grep -v ebiten.CurrentTPS | grep -v deltaTime | grep -v '_test.go' && \
            { echo "FAIL: Hardcoded 1.0/60.0 frame time detected — use ebiten.CurrentTPS()"; exit 1; } || \
            echo "PASS: No hardcoded frame time found"

      - name: Guardrails scan — O(n*m) enemy targeting
        run: |
          echo "Scanning for linear enemy scans in tower code..."
          grep -rnE 'for\s+.*range\s+.*(enemies|Enemies)' --include="*.go" src/ | grep -v grid | grep -v quadtree | grep -v spatial | grep -v '_test.go' && \
            { echo "FAIL: Linear enemy scan in tower code — use spatial partitioning"; exit 1; } || \
            echo "PASS: No linear enemy scans found"

      - name: Guardrails scan — ignored errors
        run: |
          echo "Scanning for ignored error returns..."
          grep -rnE '^\s*_,\s*_\s*=\s*\w+\(' --include="*.go" src/ | grep -v '_test.go' && \
            { echo "FAIL: Ignored error return values detected"; exit 1; } || \
            echo "PASS: No ignored error returns found"

      - name: Asset count check
        run: |
          ASSET_COUNT=$(find assets/ -type f 2>/dev/null | wc -l)
          echo "Asset count: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -gt 500 ]; then
            echo "WARN: Asset count ($ASSET_COUNT) exceeds 500 — consider atlas packing and removing unused assets"
          fi
